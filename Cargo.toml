[workspace]
resolver = "2"
members = ["crates/lattice", "crates/lattice-event", "crates/lattice-metal", "crates/allocator", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
blake3 = "1.5"

[profile.dev]
debug = 1

[profile.release]
debug = 1
lto = "thin"
