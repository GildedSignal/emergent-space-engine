[workspace]
resolver = "2"
members = ["crates/engine", "crates/law-lab", "crates/observatory", "xtask"]
default-members = ["crates/engine", "crates/law-lab", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"
blake3 = "1.5"
thiserror = "2.0"

[profile.dev]
debug = 1

[profile.release]
debug = 1
lto = "thin"

