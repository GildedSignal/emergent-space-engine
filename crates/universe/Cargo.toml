[package]
name = "emergent-universe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The plane: one star system, whole. A doll tree of exact tubes (crates/space), one clock and one queue, motion as the compiled drift plus kicks (Wisdom-Holman with SyMBA's smooth changeover), a fleet battle in a Fermi frame (crates/engine), the player's thrust, and a pure past-light-cone view."

[dependencies]
emergent-space = { path = "../space" }
emergent-engine = { path = "../engine" }
emergent-lattice = { path = "../lattice" }
emergent-lattice-event = { path = "../lattice-event" }
blake3.workspace = true

[features]
# Stage timers for the frame's cost (crate::prof); off, every call is empty and the engine is what it was.
prof = []
