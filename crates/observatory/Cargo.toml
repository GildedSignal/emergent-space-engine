[package]
name = "emergent-observatory"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "emergent_observatory"
path = "src/lib.rs"

[[bin]]
name = "emergent-observatory"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:eframe", "dep:png", "dep:emergent-engine"]

[dependencies]
emergent-engine = { path = "../engine", optional = true }
emergent-law-lab = { path = "../law-lab" }
eframe = { version = "=0.31.1", optional = true, default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
serde.workspace = true
serde_json.workspace = true
num-traits.workspace = true
png = { version = "=0.17.16", optional = true }
